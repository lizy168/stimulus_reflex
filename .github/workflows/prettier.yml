name: Run Prettier Lints

on:
  - push
  - pull_request

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Yarn
      uses: Borales/actions-yarn@v2
      with:
        args: install
    - name: Prettier
      uses: Borales/actions-yarn@v2
      with:
        args: run prettier-check