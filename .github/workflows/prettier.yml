name: Run Prettier Lints

on:
  - push
  - pull_request

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Yarn
      uses: Borales/actions-yarn@master
      with:
        cmd: install
    - name: Prettier
      uses: Borales/actions-yarn@master
      with:
        cmd: run prettier-check